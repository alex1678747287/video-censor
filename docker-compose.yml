version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VOLCANO_API_KEY=${VOLCANO_API_KEY}
      - VOLCANO_MODEL=${VOLCANO_MODEL:-doubao-seed-2-0-lite-260215}
      - UPLOAD_DIR=/app/data/uploads
      - OUTPUT_DIR=/app/data/outputs
    depends_on:
      - redis

  worker:
    build: ./backend
    command: celery -A app.worker worker --loglevel=info --concurrency=2
    volumes:
      - ./data:/app/data
    environment:
      - REDIS_URL=redis://redis:6379/0
      - VOLCANO_API_KEY=${VOLCANO_API_KEY}
      - VOLCANO_MODEL=${VOLCANO_MODEL:-doubao-seed-2-0-lite-260215}
      - UPLOAD_DIR=/app/data/uploads
      - OUTPUT_DIR=/app/data/outputs
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  redis_data:
